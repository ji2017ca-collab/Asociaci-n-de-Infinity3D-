<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Infinity HTML Editor</title> <style> *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#111318; color:#fff; } .app{ width:100%; height:100vh; display:flex; flex-direction:column; } /* BARRA SUPERIOR */ .topbar{ height:54px; min-height:54px; background:#181b22; border-bottom:1px solid #30343d; display:flex; align-items:center; padding:0 12px; gap:10px; } .logo{ font-weight:bold; font-size:18px; color:#55aaff; margin-right:10px; } .status{ display:flex; align-items:center; gap:6px; font-size:12px; color:#aaa; } .dot{ width:8px; height:8px; border-radius:50%; background:#42d97b; box-shadow:0 0 8px #42d97b; } /* CONTENEDOR */ .workspace{ flex:1; min-height:0; display:flex; } /* EDITOR */ .editor{ width:50%; height:100%; display:flex; flex-direction:column; background:#0d0f13; border-right:2px solid #292d35; } .panel-title{ height:38px; min-height:38px; display:flex; align-items:center; padding:0 12px; background:#171a20; color:#aaa; font-size:12px; border-bottom:1px solid #292d35; } .file{ color:#ddd; } /* ÁREA DE CÓDIGO */ .code-area{ flex:1; min-height:0; position:relative; display:flex; overflow:hidden; } .lines{ width:42px; min-width:42px; padding-top:14px; background:#0b0d11; color:#555b66; text-align:right; padding-right:9px; font:14px/22px monospace; user-select:none; overflow:hidden; } textarea{ flex:1; width:100%; height:100%; resize:none; border:0; outline:none; padding:14px 14px; background:#0d0f13; color:#e8edf5; font:14px/22px monospace; tab-size:2; white-space:pre; overflow:auto; } textarea::selection{ background:#315b87; } /* PREVIEW */ .preview{ width:50%; height:100%; display:flex; flex-direction:column; background:#fff; } .preview iframe{ flex:1; width:100%; border:0; background:white; } /* BARRA INFERIOR */ .bottom{ height:30px; min-height:30px; background:#181b22; border-top:1px solid #30343d; display:flex; align-items:center; justify-content:space-between; padding:0 10px; font-size:11px; color:#888; } .live{ color:#4de28a; } /* TABLET / MÓVIL */ @media(max-width:700px){ .workspace{ flex-direction:column; } .editor, .preview{ width:100%; } .editor{ height:50%; border-right:0; border-bottom:2px solid #292d35; } .preview{ height:50%; } .topbar{ height:48px; min-height:48px; } .logo{ font-size:16px; } textarea{ font-size:13px; } .lines{ font-size:13px; } } </style> </head> <body> <div class="app"> <div class="topbar"> <div class="logo">∞ HTML</div> <div class="status"> <span class="dot"></span> EJECUCIÓN EN TIEMPO REAL </div> </div> <div class="workspace"> <!-- EDITOR --> <section class="editor"> <div class="panel-title"> <span class="file">index.html</span> </div> <div class="code-area"> <div class="lines" id="lines"></div> <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea> </div> </section> <!-- RESULTADO --> <section class="preview"> <div class="panel-title"> Vista previa </div> <iframe id="preview"></iframe> </section> </div> <div class="bottom"> <span>HTML • CSS • JavaScript</span> <span class="live">● LIVE</span> </div> </div> <script> const code = document.getElementById("code"); const preview = document.getElementById("preview"); const lines = document.getElementById("lines"); /* CÓDIGO INICIAL */ const initialCode = `<!DOCTYPE html> <html> <head> <style> body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #111827; color: white; font-family: Arial; } .card { padding: 35px; border-radius: 20px; background: #1f2937; text-align: center; } h1 { color: #55aaff; } </style> </head> <body> <div class="card"> <h1>Hola 👋</h1> <p>Escribe código y mira el resultado.</p> </div> <script> console.log("HTML Editor funcionando"); <\/script> </body> </html>`; code.value = initialCode; /* ACTUALIZAR NÚMEROS DE LÍNEA */ function updateLines(){ const total = code.value.split("\\n").length; let html = ""; for(let i = 1; i <= total; i++){ html += i + "<br>"; } lines.innerHTML = html; } /* EJECUTAR AUTOMÁTICAMENTE */ let timer; function run(){ clearTimeout(timer); timer = setTimeout(() => { const html = code.value; const doc = preview.contentDocument || preview.contentWindow.document; doc.open(); doc.write(html); doc.close(); }, 100); updateLines(); } /* CAMBIO DE CÓDIGO */ code.addEventListener("input", run); /* SCROLL SINCRONIZADO */ code.addEventListener("scroll", () => { lines.scrollTop = code.scrollTop; }); /* TAB DENTRO DEL EDITOR */ code.addEventListener("keydown", e => { if(e.key === "Tab"){ e.preventDefault(); const start = code.selectionStart; const end = code.selectionEnd; code.value = code.value.substring(0,start) + " " + code.value.substring(end); code.selectionStart = code.selectionEnd = start + 2; run(); } }); /* ATAJO CTRL + S */ document.addEventListener("keydown", e => { if((e.ctrlKey || e.metaKey) && e.key === "s"){ e.preventDefault(); } }); /* INICIO */ updateLines(); run(); </script> </body> </html>
